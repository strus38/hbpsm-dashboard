<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HBPSM — préparation du prochain match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Couleurs du club, reprises du profil HBPSM de HANDBALL-training (clubs/hbpsm/profil.json).
     Elles ont un RÔLE : la STRUCTURE (bleu marine) tient l'ossature — bandeau, titres, boutons,
     liens, terrain ; l'ACCENT (jaune) marque ce qui est actif ou mis en avant, toujours avec un
     texte foncé : un texte clair sur le jaune est illisible. */
  --structure-900:#0b2a52; --structure-800:#103866; --structure-700:#16487f; --structure-500:#1f6fbd;
  --structure-100:#e4eefa; --structure-050:#f2f7fd;
  --accent:#ffc72c; --accent-clair:#fff3d1; --accent-fonce:#d99e00;
  /* neutres et états, comme dans HANDBALL-training */
  --bg:#f5f7fa; --surface:#FFFFFF; --ink:#16202e; --muted:#5a6a7d; --rule:#d8dfe8;
  --win:#1c7a45; --loss:#b3261e; --draw:#7d8589;
  /* rôles dérivés : ce que chaque élément utilise */
  --heading:var(--structure-900); --link:var(--structure-700); --focus:var(--structure-500);
  --court:var(--structure-700); --court-deep:var(--structure-900); --chalk:#F5F7F4;
  --on-accent:var(--structure-900); --accent-trait:var(--accent-fonce); --us-bg:var(--accent-clair);
  --bar-for:var(--structure-500); --track:var(--structure-500);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Sombre : le même bleu marine sert de fond, le jaune garde son rôle. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071a31; --surface:#0d2747; --ink:#e8eff8; --muted:#9db1c9; --rule:#1d3d63;
    --heading:#FFFFFF; --link:#8cc2f5; --focus:#5aa0e6; --court:#16487f; --court-deep:#0b2a52;
    --accent-trait:var(--accent); --us-bg:#16487f;
    --bar-for:#5aa0e6; --track:#5aa0e6; --win:#4fb980; --loss:#ec7a66; --draw:#9aa3a7;
  }
}
:root[data-theme="dark"]{
  --bg:#071a31; --surface:#0d2747; --ink:#e8eff8; --muted:#9db1c9; --rule:#1d3d63;
  --heading:#FFFFFF; --link:#8cc2f5; --focus:#5aa0e6; --court:#16487f; --court-deep:#0b2a52;
  --accent-trait:var(--accent); --us-bg:#16487f;
  --bar-for:#5aa0e6; --track:#5aa0e6; --win:#4fb980; --loss:#ec7a66; --draw:#9aa3a7;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;color:var(--heading)}
h1{font-size:2.1rem;letter-spacing:.01em}
h2{font-size:1.45rem;margin:28px 0 10px}
h3{font-size:1.1rem;font-weight:600}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.club{background:var(--structure-900);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.club div{max-width:760px;margin:0 auto;display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.club b{font:700 1.25rem var(--display);letter-spacing:.03em;color:var(--accent)}
.club span{font-size:.86rem;color:var(--structure-100)}
.club .etat{margin-left:auto;font-size:.78rem}
.demo a{color:var(--on-accent)}
header.top{padding:18px 0 6px}
header.top .when{font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--muted)}
.demo{background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:6px;margin:12px 0 0;font-weight:600;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px}
.panel + .panel{margin-top:12px}
select,button{font:inherit;color:inherit}
select{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;max-width:100%}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-weight:600;cursor:pointer;border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.court{background:var(--court);border-radius:10px;overflow:hidden;margin:12px 0}
.court svg{display:block;width:100%;height:auto}
.court .line{stroke:var(--chalk);stroke-width:2;fill:none}
.court .zone{fill:var(--accent)}
.court .tok circle{fill:var(--chalk)}
.court .tok .n{font:700 17px var(--display);fill:var(--court-deep);text-anchor:middle}
.court .tok .nm{font:600 11.5px var(--body);fill:#fff;text-anchor:middle}
.court .tok .ps{font:600 10px var(--body);fill:var(--accent);text-anchor:middle}
.court .tok.gb .nm,.court .tok.gb .ps{fill:var(--court-deep)}
.court .tok.vide circle{fill:none;stroke:var(--chalk);stroke-dasharray:4 4}
ul.plain{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .jersey{font:700 1.25rem var(--display);text-align:center;color:var(--link)}
.row .who{min-width:0}
.row .who b{font-weight:600}
.row .why{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.row .score{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid var(--rule);margin-left:6px;vertical-align:1px}
.tag.start{background:var(--structure-700);color:#fff;border-color:var(--structure-700)}
.out{opacity:.5}
.link{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font-size:.84rem}
.form{display:inline-flex;gap:4px;vertical-align:middle}
.form i{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font:700 .72rem var(--body);font-style:normal;color:#fff}
.V{background:var(--win)} .D{background:var(--loss)} .N{background:var(--draw)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:10px 0}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpis div{border:1px solid var(--rule);border-radius:8px;padding:8px}
.kpis .num{font-size:1.6rem;display:block;line-height:1}
.kpis span{font-size:.78rem;color:var(--muted)}
.kpis .num.half{font-size:1.2rem;white-space:nowrap;line-height:1.35}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:92px;margin-top:8px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;font-size:.7rem;color:var(--muted)}
.bars .pair{display:flex;gap:2px;align-items:flex-end;height:64px}
.bars .pair i{width:11px;border-radius:2px 2px 0 0;display:block}
.bars .f,.legend .f{background:var(--bar-for)} .bars .a,.legend .a{background:var(--draw)}
.legend{font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 6px;text-align:right;border-top:1px solid var(--rule);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);border-top:0;font-size:.78rem}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
table.duo th:nth-child(2),table.duo td:nth-child(2){text-align:right}
td.team{white-space:normal;min-width:150px}
tr.us td{font-weight:600;background:var(--us-bg)}
tr.us td:first-child{box-shadow:inset 3px 0 var(--accent)}
details{border-top:1px solid var(--rule)}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.comp{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:.84rem;margin:4px 0}
.comp .track{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.comp .track i{display:block;height:100%;background:var(--track)}
.edit{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--rule);align-items:center;font-size:.92rem}
.res:first-child{border-top:0}
.res .sc{font:700 1.2rem var(--display);text-align:center;min-width:64px}
.res .r{text-align:right}
.res .meta{grid-column:1/-1;font-size:.76rem;color:var(--muted);margin-top:-4px}
nav.tabs{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);display:flex;justify-content:center;z-index:5}
nav.tabs button{flex:1;max-width:160px;border:0;background:none;padding:12px 2px 10px;font:600 1rem var(--display);letter-spacing:.02em;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--heading);border-bottom-color:var(--accent)}
section[hidden]{display:none}
.stake{padding:12px 0;border-top:1px solid var(--rule)}
.stake:first-child{border-top:0}
.stake .head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline}
.stake .gain{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.stake .gain small{font:500 .72rem var(--body);color:var(--muted);display:block;text-align:right;margin-top:-4px}
.stake .range{position:relative;height:10px;background:var(--rule);border-radius:5px;margin:10px 0 6px}
.stake .range i{position:absolute;top:0;bottom:0;background:var(--track);border-radius:5px}
.stake.key .range i{background:var(--accent-trait)}
.tag.key{background:var(--accent);color:var(--on-accent);border-color:var(--accent-fonce)}
.big{font:700 3.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.axis{padding:10px 0;border-top:1px solid var(--rule)}
.axis:first-child{border-top:0}
.btn:hover{background:var(--structure-800)}
.btn{display:inline-block;background:var(--structure-700);color:#fff;text-decoration:none;font-weight:600;padding:10px 14px;border:0;border-radius:8px;margin-top:10px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.facts{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.88rem;margin:10px 0}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-weight:600}
.gate{max-width:420px;margin:12vh auto 0}
.gate input{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:11px 12px;margin:10px 0 0}
.gate input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gate .err{color:var(--loss);font-weight:600;margin-top:10px}
.status{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.status a,.status button{color:var(--link)}
nav.tabs[hidden]{display:none}
.note{border-left:3px solid var(--accent);padding:6px 0 6px 10px;margin:12px 0;font-size:.88rem;color:var(--muted)}
@media (min-width:620px){h1{font-size:2.6rem}}
</style>
</head>
<body>
<header class="club"><div><b id="club-nom">HBPSM</b><span id="club-titre">Tableau de bord</span><span id="club-etat" class="etat" aria-live="polite"></span></div></header>
<nav class="tabs" role="tablist" aria-label="Rubriques" hidden>
  <button role="tab" data-tab="match" aria-selected="true">Match</button>
  <button role="tab" data-tab="joueurs" aria-selected="false">Joueurs</button>
  <button role="tab" data-tab="duos" aria-selected="false">Duos</button>
  <button role="tab" data-tab="saison" aria-selected="false">Saison</button>
  <button role="tab" data-tab="poules" aria-selected="false">Poules</button>
</nav>
<main id="app"></main>
<script id="data" type="application/json">null</script>
<script id="cfg" type="application/json">{"src": "https://raw.githubusercontent.com/strus38/hbpsm-dashboard/main/publie/hbpsm.enc", "manifeste": "https://raw.githubusercontent.com/strus38/hbpsm-dashboard/main/publie/manifeste.json", "versions": "https://github.com/strus38/hbpsm-dashboard/releases/latest", "app": "182318e0accd", "club": "HBPSM", "verif": 600}</script>
<script>
"use strict";
let D = JSON.parse(document.getElementById("data").textContent);   // null dans la page publiée
const CFG = JSON.parse(document.getElementById("cfg").textContent);
const VAULT = "hbpsm:coffre", PASS = "hbpsm:phrase";
// Tout le calcul est fait par la collecte sur GitHub : la page lit le résultat chiffré, ne refait
// que la composition d'équipe (absences et postes saisis ici), et revient voir s'il y a du nouveau.
const VERIF = Math.max(1, Number(CFG.verif) || 600) * 1000;
let GENERE = null, CHECKED = null, ONLINE = false, CHECKING = false, NEWER = false;
const POSTES = ["GB","ALG","ARG","DC","ARD","ALD","PIV"];
const POSTE_NOM = {GB:"Gardien",ALG:"Ailier gauche",ARG:"Arrière gauche",DC:"Demi-centre",ARD:"Arrière droit",ALD:"Ailier droit",PIV:"Pivot"};
const PLAN_NOM = {equilibre:"Équilibré",attaque:"Attaque",rigueur:"Rigueur"};
const COMP_NOM = {att:"Buts récents",eff:"Réussite au tir",disc:"Discipline",imp:"Impact équipe",clutch:"Fins de match",assid:"Assiduité",gk:"% d'arrêts",gk_vol:"Arrêts par match"};
const GK_COMPS = ["gk","gk_vol","imp","assid"];
const KEY = "hbpsm:v1";
const OPEN = new Set();
let S = {postes:{}, absents:{}, plan:null, adv:null, tab:"match", poule:null};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr = n => n == null ? "–" : String(n).replace(".", ",");
const isUs = t => t === D.meta.club;
const poste = p => (S.postes[p.cle] ?? p.poste ?? "");
const isGK = p => poste(p) ? poste(p).split("/").includes("GB") : p.gardien;
const dispo = p => S.absents[p.cle] === undefined ? p.disponible !== false : !S.absents[p.cle];

function fmtDate(iso, provisoire){
  if(!iso) return "date à confirmer";
  const d = new Date(iso.length <= 10 ? iso + "T12:00" : iso);
  if(isNaN(d)) return iso;
  const day = d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
  if(provisoire) return "week-end du " + day + " (date à confirmer)";
  return iso.length > 10 ? day + " à " + iso.slice(11,16).replace(":","h") : day;
}
// les trois sanctions de la feuille, à ne pas confondre : avertissement, 2 minutes, disqualification
const sanctions = p => [p.jaunes ? p.jaunes+" CJ" : "", p.deux_min ? p.deux_min+" × 2 min" : "",
  p.rouges ? p.rouges+" CR" : ""].filter(Boolean).join(", ") || "aucune sanction";
const forme = f => '<span class="form" aria-label="Forme : '+f.join(" ")+'">'+f.map(r=>'<i class="'+r+'">'+r+'</i>').join("")+'</span>';

function opponent(){
  const names = Object.keys(D.equipes).filter(t => !isUs(t)).sort();
  let adv = S.adv && D.equipes[S.adv] ? S.adv : (D.prochain && D.prochain.adversaire);
  if(!adv || !names.includes(adv)){ adv = (D.prochain && D.prochain.adversaire) || names[0] || null; }
  return {adv, names};
}
function currentPlan(adv){
  const rec = (adv && D.equipes[adv] && D.equipes[adv].plan) || "equilibre";
  return {plan: S.plan || rec, rec};
}
// Gardien : arrêts face aux tirs cadrés subis (arrêts + buts pris). Joueur de champ : buts face aux tirs.
function shotLine(p){
  if(isGK(p)){
    if(p.tirs_subis) return p.pct_arrets+" % d'arrêts ("+p.arrets+" arrêts, "+p.pris+" buts pris sur "+p.tirs_subis
      +" tirs cadrés"+(p.pris_estime ? ", buts pris estimés" : "")+")";
    return p.arrets ? p.arrets+" arrêts" : "aucun arrêt";
  }
  return p.tirs ? p.buts+" buts sur "+p.tirs+" tirs ("+p.reussite+" %)" : p.buts+" buts";
}
function reasons(p){
  if(!p.m) return "pas encore aligné cette saison : pas de note";
  const out = [];
  if(isGK(p)){
    if(p.tirs_subis) out.push(p.pct_arrets+" % d'arrêts ("+p.arrets+" sur "+p.tirs_subis+" tirs cadrés"+(p.pris_estime?", estimé":"")+")");
    else if(p.arrets) out.push(fr((p.arrets/p.m).toFixed(1))+" arrêts/match");
  } else {
    if(p.buts) out.push(fr(p.forme_buts)+" but"+(p.forme_buts >= 2 ? "s" : "")+"/match récents");
    if(p.tirs) out.push(p.buts+" sur "+p.tirs+" tirs ("+p.reussite+" %)");
  }
  if(p.decisifs) out.push(p.decisifs+" but"+(p.decisifs>1?"s":"")+" en fin de match serré");
  if(p.impact >= 1) out.push("équipe à +"+fr(p.impact)+" avec lui");
  if(p.impact <= -1) out.push("équipe à "+fr(p.impact)+" avec lui");
  if(p.deux_min) out.push(fr((p.deux_min/p.m).toFixed(1))+" × 2 min/match");
  if(p.rouges) out.push(p.rouges+" carton"+(p.rouges>1?"s":"")+" rouge"+(p.rouges>1?"s":""));
  if(!p.deux_min && !p.rouges && p.m >= 2) out.push("aucune exclusion");
  out.push(p.m+" match"+(p.m>1?"s":""));
  return out.join(", ");
}
// Feuille de match : D.meta.effectif joueurs (12), dont D.meta.gardiens gardiens (2), les mieux notés
// parmi les disponibles. S'il manque du monde, un joueur de l'effectif pas encore aligné complète.
const byScore = (a, b) => (b.s ?? -1) - (a.s ?? -1);
function lineup(plan){
  const size = D.meta.effectif || 12, nGK = D.meta.gardiens ?? 2;
  const pool = D.joueurs.filter(p => dispo(p)).map(p => ({p, s: p.m > 0 ? p.scores[plan] : null})).sort(byScore);
  const gks = pool.filter(x => isGK(x.p)).slice(0, nGK);
  const field = pool.filter(x => !isGK(x.p)).slice(0, size - gks.length);
  const picked = new Set([...gks, ...field]), used = new Set(), start = {};
  if(gks[0]){ start.GB = gks[0]; used.add(gks[0]); }
  const withPoste = field.filter(x => poste(x.p)).length;
  if(withPoste >= 4){
    for(const pos of POSTES.slice(1)){
      const c = field.find(x => !used.has(x) && poste(x.p).split("/").includes(pos));
      if(c){ start[pos] = c; used.add(c); }
    }
    for(const pos of POSTES.slice(1)){
      if(start[pos]) continue;
      const c = field.find(x => !used.has(x) && !poste(x.p));
      if(c){ start[pos] = c; used.add(c); }
    }
  }
  return {start, bench: [...picked].filter(x => !used.has(x)).sort(byScore), hasCourt: withPoste >= 4,
          size, nGK, missing: size - picked.size, missingGK: nGK - gks.length,
          out: D.joueurs.filter(p => !dispo(p)), left: pool.filter(x => !picked.has(x))};
}
function shortName(n){
  const parts = String(n).trim().split(/\s+/);
  const up = parts.filter(w => w.length > 1 && /[A-ZÀ-Ý]/.test(w) && w === w.toUpperCase());
  const s = (up.length && up.length < parts.length ? up.join(" ") : parts.slice(0,2).join(" "));
  return s.length > 13 ? s.slice(0,12) + "." : s;
}
function courtSVG(start){
  const pos = {GB:[170,34],ALG:[44,64],ALD:[296,64],PIV:[170,112],ARG:[70,178],DC:[170,204],ARD:[270,178]};
  let tok = "";
  for(const k of POSTES){
    const [x,y] = pos[k], c = start[k];
    const name = c ? esc(shortName(c.p.nom)) : "à pourvoir";
    tok += '<g class="tok'+(c?"":" vide")+(k==="GB"?" gb":"")+'" transform="translate('+x+','+y+')"><circle r="15"/>'
      + '<text class="n" y="6">'+(c ? esc(c.p.num ?? "") : "")+'</text>'
      + '<text class="nm" y="30">'+name+'</text><text class="ps" y="43">'+k+'</text></g>';
  }
  return '<div class="court"><svg viewBox="0 0 340 262" role="img" aria-label="Sept de départ proposé sur le demi-terrain">'
    + '<path class="zone" d="M70 6 A100 100 0 0 0 270 6 Z" opacity=".9"/>'
    + '<path class="line" d="M70 6 A100 100 0 0 0 270 6"/>'

function common(adv){
  const us = D.equipes[D.meta.club], them = D.equipes[adv];
  if(!us || !them) return "";
  const rows = [];
  for(const m of us.matches){
    const t = them.matches.filter(x => x.adv === m.adv);
    for(const x of t) rows.push('<tr><td class="team">'+esc(m.adv)+'</td><td>'+m.res+" "+m.bp+"-"+m.bc+'</td><td>'+x.res+" "+x.bp+"-"+x.bc+'</td></tr>');
  }
  const direct = us.matches.filter(m => m.adv === adv).map(m => m.res+" "+m.bp+"-"+m.bc+(m.dom?" (dom.)":" (ext.)"));
  let h = "";
  if(direct.length) h += '<p>Déjà joué cette saison : <b>'+direct.join(", ")+'</b>.</p>';
  if(rows.length) h += '<div class="scroll"><table><thead><tr><th>Adversaire commun</th><th>'+esc(D.meta.club_court)+'</th><th>Eux</th></tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';
  return h ? '<h2>Repères communs</h2><div class="panel">'+h+'</div>' : "";
}

    + odd.map(ecart).join(" ; ")+'.</p>';
  const res = D.resultats.filter(r => r.poule === cur);
  h += '<h2>Résultats</h2><div class="panel">'+(res.length ? res.map(r=>'<div class="res"><span class="r">'+esc(r.dom)+'</span><span class="sc">'+r.sd+" - "+r.se+'</span><span>'+esc(r.ext)+'</span><span class="meta">J'+esc(r.journee ?? "?")+", "+esc(fmtDate((r.date||"").slice(0,10)))+(r.feuille?"":", feuille non lue")+'</span></div>').join("") : "<p>Aucun résultat pour l'instant.</p>")+'</div>';
  const next = D.a_venir.filter(r => r.poule === cur).slice(0,8);
  if(next.length) h += '<h2>À venir</h2><div class="panel">'+next.map(r=>'<div class="res"><span class="r">'+esc(r.dom)+'</span><span class="sc muted">–</span><span>'+esc(r.ext)+'</span><span class="meta">J'+esc(r.journee ?? "?")+", "+esc(fmtDate(r.date, r.provisoire))+'</span></div>').join("")+'</div>';
  h += '<p class="small muted" style="margin-top:14px">Mis à jour le '+esc(D.meta.genere)+'. '+D.meta.feuilles+' feuille'+(D.meta.feuilles>1?"s":"")+' lue'+(D.meta.feuilles>1?"s":"")+' sur '+D.meta.matchs+' match'+(D.meta.matchs>1?"s":"")+' joué'+(D.meta.matchs>1?"s":"")+'.</p>';
  if(GENERE) h += '<p class="status"><span id="source">'+esc(sourceText())+'</span> <button class="link" data-lock="1">Oublier la phrase secrète sur cet ordinateur</button></p>';
  return h;
}
const emptyPanel = () => '<div class="panel"><p>Aucune donnée pour l\'instant. Lance le workflow « Collecte hebdomadaire » dans l\'onglet Actions du dépôt.</p></div>';
const empty = () => '<header class="top"><h1>'+esc(D.meta.club_court)+'</h1></header>'+emptyPanel();
const VIEWS = {match:viewMatch, joueurs:viewJoueurs, duos:viewDuos, saison:viewSaison, poules:viewPoules};
function render(keepScroll){
  const y = window.scrollY;
  document.getElementById("club-nom").textContent = D.meta.club_court || CFG.club || "HBPSM";
  document.getElementById("club-titre").textContent = "Tableau de bord" + (D.meta.saison ? " · saison " + D.meta.saison : "");
  const newer = NEWER && CFG.versions ? '<p class="demo">Une version plus récente de ce fichier existe. <a href="'
    + esc(CFG.versions)+'" target="_blank" rel="noopener">La télécharger</a></p>' : "";
  document.getElementById("app").innerHTML = newer + VIEWS[S.tab]();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  window.scrollTo(0, keepScroll ? y : 0);
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ S.tab = t.dataset.tab; save(); render(false); }
  else if(t.dataset.plan){ S.plan = t.dataset.plan; save(); render(true); }
  else if(t.dataset.poule){ S.poule = t.dataset.poule; save(); render(true); }
  else if(t.dataset.dl && D.seance_hbt){
    const url = URL.createObjectURL(new Blob([JSON.stringify(D.seance_hbt, null, 2)], {type:"application/json"}));
    const a = Object.assign(document.createElement("a"), {href:url, download:"seance-prochaine.hbt.json"});
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  else if(t.dataset.abs){ const p = D.joueurs.find(x => x.cle === t.dataset.abs); S.absents[p.cle] = dispo(p); save(); render(true); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.id === "adv"){ S.adv = t.value; S.plan = null; save(); render(true); }
  else if(t.dataset.poste !== undefined){ S.postes[t.dataset.poste] = t.value; save(); render(true); }
});
document.addEventListener("toggle", ev => {
  const d = ev.target; if(!d.dataset || !d.dataset.cle) return;
  d.open ? OPEN.add(d.dataset.cle) : OPEN.delete(d.dataset.cle);
}, true);
if(!VIEWS[S.tab]) S.tab = "match";

const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function openVault(env, phrase){
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(phrase.trim()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(env.sel), iterations:env.iterations, hash:"SHA-256"},
    material, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(env.nonce)}, key, b64(env.donnees));
  return JSON.parse(new TextDecoder().decode(plain));
}
const stored = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
function gate(message, busy){
  document.querySelector("nav.tabs").hidden = true;
  document.getElementById("app").innerHTML = '<div class="gate"><h1>'+esc(CFG.club || "Tableau de bord")+'</h1>'
    + '<p class="muted" style="margin-top:8px">Les résultats sont chiffrés. Saisis la phrase secrète donnée par le club : elle reste sur cet ordinateur.</p>'
    + '<label class="small muted" for="phrase" style="display:block;margin-top:14px">Phrase secrète</label>'
    + '<input id="phrase" type="password" autocomplete="current-password"'+(busy?" disabled":"")+'>'
    + '<button class="btn" id="unlock"'+(busy?" disabled":"")+'>'+(busy?"Ouverture…":"Ouvrir le tableau de bord")+'</button>'
    + (message ? '<p class="err" role="alert">'+esc(message)+'</p>' : "") + '</div>';
  const input = document.getElementById("phrase");
  if(input && !busy) input.focus();
}
const hhmm = d => d.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
function sourceText(){
  const g = new Date(GENERE);
  return "Données du " + (isNaN(g) ? GENERE : g.toLocaleString("fr-FR", {dateStyle:"medium", timeStyle:"short"}))
    + (ONLINE ? ", dernière vérification à " + hhmm(CHECKED) + " (toutes les " + Math.round(VERIF / 60000 || 1) + " min)."
              : ", copie gardée sur cet ordinateur (hors connexion" + (CHECKED ? ", dépôt injoignable à " + hhmm(CHECKED) : "") + ").");
}
function status(){
  const etat = document.getElementById("club-etat"), src = document.getElementById("source");
  if(etat) etat.textContent = !GENERE ? "" : ONLINE ? "à jour · " + hhmm(CHECKED) : "hors connexion";
  if(src && GENERE) src.textContent = sourceText();
}
async function fetchVault(){
  const r = await fetch(CFG.src + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function show(box){
  D = Object.assign(box.data, {seance_hbt: box.seance_hbt});
  GENERE = box.genere;
}
// Le manifeste (quelques octets) dit la date des dernières données publiées : on ne télécharge
// et ne déchiffre le coffre que s'il a changé, puis on redessine sans perdre onglet ni réglages.
async function check(){
  const phrase = stored(PASS);
  if(CHECKING || !GENERE || !phrase || !CFG.manifeste) return;
  CHECKING = true;
  try {
    const m = await (await fetch(CFG.manifeste + "?t=" + Date.now(), {cache:"no-store"})).json();
    CHECKED = new Date(); ONLINE = true;
    if(m.app && m.app !== CFG.app && !NEWER){ NEWER = true; render(true); }  // la page elle-même a évolué
    if(m.maj && m.maj !== GENERE){
      const env = await fetchVault();
      let box;
      try { box = await openVault(env, phrase); }
      catch (e) { try { localStorage.removeItem(PASS); } catch (x) {} D = null; GENERE = null;
                  gate("Les données ont été chiffrées avec une nouvelle phrase secrète : demande-la au club."); return; }
      if(box.genere !== GENERE){
        try { localStorage.setItem(VAULT, JSON.stringify(env)); } catch (e) {}
        show(box);
        render(true);
      }
    }
  } catch (e) { CHECKED = new Date(); ONLINE = false; }
  finally { CHECKING = false; status(); }
}
setInterval(check, VERIF);
document.addEventListener("visibilitychange", () => { if(!document.hidden && Date.now() - (CHECKED || 0) > 60000) check(); });
window.addEventListener("online", check);
async function start(phrase){
  if(!window.crypto || !window.crypto.subtle){ gate("Ce navigateur ne sait pas déchiffrer les données. Essaie avec Chrome, Edge ou Firefox récents."); return; }
  if(!phrase){ gate(""); return; }
  gate("", true);
  let env = null, fresh = false;
  try { env = await fetchVault(); fresh = true; } catch (e) {}
  if(!env){ try { env = JSON.parse(stored(VAULT) || "null"); } catch (e) {} }
  if(!env){ gate("Impossible de joindre les données, et aucune copie n'existe encore sur cet ordinateur. Vérifie la connexion."); return; }
  let box;
  try { box = await openVault(env, phrase); }
  catch (e) { try { localStorage.removeItem(PASS); } catch (x) {} gate("Phrase secrète incorrecte."); return; }
  try { localStorage.setItem(PASS, phrase.trim()); if(fresh) localStorage.setItem(VAULT, JSON.stringify(env)); } catch (e) {}
  show(box);
  CHECKED = new Date(); ONLINE = fresh;
  document.querySelector("nav.tabs").hidden = false;
  render(false);
  status();
  check();  // le manifeste dit aussi si la page elle-même a une version plus récente
}
document.addEventListener("click", ev => {
  if(ev.target.id === "unlock") start(document.getElementById("phrase").value);
  else if(ev.target.dataset && ev.target.dataset.lock){ try { localStorage.removeItem(PASS); localStorage.removeItem(VAULT); } catch (e) {} D = null; GENERE = null; status(); gate(""); }
});
document.addEventListener("keydown", ev => { if(ev.key === "Enter" && ev.target.id === "phrase") start(ev.target.value); });
if(D){ document.querySelector("nav.tabs").hidden = false; render(false); }
else start(stored(PASS));
</script>
