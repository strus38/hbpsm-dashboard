# Configuration du suivi HBPSM
saison: "2026-2027"
club:
  nom_affiche: "HBPSM"
  # Le club est reconnu si le nom d'équipe contient l'un de ces motifs (sans accents, majuscules)
  motifs: ["ST MARCELLIN", "SAINT MARCELLIN", "ST-MARCELLIN", "HBPSM"]
# Page de la compétition sur ffhandball.fr (vérifiée le 04/10/2026 via le site de la ligue AURA)
competition: "https://www.ffhandball.fr/competitions/saison-2026-2027-22/regional/2eme-division-masculine-p16-aura-30501/"
poules:
  # Laisser vide : la collecte cherche chaque poule depuis la page de la compétition.
  # Si elle n'y arrive pas, coller ici l'adresse de la poule (…/poule-<numéro>/).
  - id: "71"
    url: "https://www.ffhandball.fr/competitions/saison-2026-2027-22/regional/2eme-division-masculine-p16-aura-30501/poule-196332/"
  - id: "72"
    url: "https://www.ffhandball.fr/competitions/saison-2026-2027-22/regional/2eme-division-masculine-p16-aura-30501/poule-196334/"
# Joueurs à choisir pour chaque match, dont les gardiens ("auto" = maximum déjà aligné cette saison)
effectif_feuille: 12
gardiens_feuille: 2
# Coupes où joue le club (demande de l'auteur, 05/10/2026) : ses matchs y comptent dans les
# statistiques des joueurs et dans la rotation, pas dans le classement ni dans les chances de la
# saison ; les gagner compte moins qu'en championnat.
coupes:
  - nom: Coupe de France
    url: "https://www.ffhandball.fr/competitions/saison-2026-2027-22/coupe-de-france/coupe-de-france-departementale-masculine-2026-2027-33244/"
    # « Le club peut aligner 14 joueurs de 17 ans et plus sur la feuille de match » (règlement FFHandball
    # de la Coupe de France régionale et départementale, art. 15, 2024-2025 et 2025-2026)
    effectif_feuille: 14
# Où chercher un adversaire de coupe qui ne joue pas dans nos poules : la collecte retrouve sa
# poule dans ces compétitions et lit ses matchs (et leurs feuilles) pour sa fiche dans
# Adversaires, hors de nos classements.
# niveau : 1 = la division au-dessus de la nôtre, 0 = la nôtre.
voisines:
  - url: "https://www.ffhandball.fr/competitions/saison-2026-2027-22/regional/1ere-division-masculine-p16-aura-30499/"
    niveau: 1
  - url: "https://www.ffhandball.fr/competitions/saison-2026-2027-22/regional/2eme-division-masculine-p16-aura-30501/"
    niveau: 0
# Écart entre deux divisions voisines : une équipe moyenne de la division du dessus marque 12 % de
# buts de plus, et en encaisse 12 % de moins, qu'une équipe moyenne de la nôtre. Hypothèse de
# départ (05/10/2026) : elle compte pour une équipe descendue de la division du dessus ou un
# adversaire de coupe qui y joue, d'autant plus qu'il a gardé ses joueurs ; à revoir avec les
# résultats de coupe entre divisions.
ecart_division: 0.12
# Postes clefs : sur chaque feuille, au moins `min` joueurs de champ pouvant tenir l'un des postes
# du groupe (choix de l'entraîneur, 05/10/2026) ; un joueur à deux postes, « ARG/DC », compte pour
# un seul groupe. Postes : ALG ARG DC ARD ALD PIV.
postes_clefs:
  - {nom: pivots, postes: [PIV], min: 2}
  - {nom: arrières, postes: [ARG, DC, ARD], min: 4}
# Caisse noire : les propositions d'amendes de n'importe quel joueur arrivent dans ce dépôt à part
# (jeton limité à lui seul, secret HBPSM_JETON_CN, rangé dans les données chiffrées) ; les trésoriers
# les valident ou les refusent dans le registre du tableau de bord.
propositions:
  depot: "strus38/hbpsm-cn"
  branche: "main"
  workflow: "proposer.yml"
# Forfait général pour la saison (constaté par l'auteur, le site ne le dit pas) : l'équipe reste
# affichée, en gris et sans rang ; ses matchs ne comptent ni au classement ni dans les chances de
# la saison, et sortent de la planification.
forfaits:
  - "P16M DIV2 RTE NORD DROME HANDBALL 2"   # 05/10/2026
# true = garde quelques captures dans raw/sample pour régler les extracteurs
# (raw/ n'est jamais versionné : il part dans l'archive chiffrée « brut » du lancement)
echantillons_debug: true
# Objectif de la première phase : rang visé dans la poule du club. Règlement AURA 2026-2027 :
# 2 montées par secteur (poules 71 et 72), format de la phase 2 publié vers février 2027.
# 3 = se qualifier pour une phase 2 réunissant les 3 premiers de chaque poule (choix de l'auteur).
objectif:
  rang: 3
# Saisons passées au même niveau : point de départ des notes, effectifs et confrontations des
# adversaires (collectées une fois par python -m pipeline.history)
historique:
  - saison: "2025-2026"
    competition: "https://www.ffhandball.fr/competitions/saison-2025-2026-21/regional/2eme-division-masculine-p16-aura-27886/"
  # la division au-dessus (1re division P16 AURA) : seulement les équipes de nos poules et nos
  # adversaires de coupe qui y jouaient, leur bilan compté avec l'écart de division
  - saison: "2025-2026"
    competition: "https://www.ffhandball.fr/competitions/saison-2025-2026-21/regional/1ere-division-masculine-p16-aura-27884/"
    niveau: 1
  # 2024-2025 : le club jouait en 1re division P16 AURA (confirmé par l'auteur ; poule 6, 10e sur 12) ;
  # seuls ses matchs et leurs feuilles, pour les statistiques de nos joueurs (demande de l'auteur,
  # 05/10/2026)
  - saison: "2024-2025"
    competition: "https://www.ffhandball.fr/competitions/saison-2024-2025-20/regional/1ere-division-masculine-p16-aura-25096/"
    niveau: 1
    club_seul: true
  # 2023-2024 : le club jouait en Honneur masculin AURA (poule 127119, adresse donnée par l'auteur ; il
  # n'était ni en 1re ni en 2e division P16) ; niveau 2 supposé, au-dessus de la 1re division P16. Nos
  # matchs seulement, pour un joueur de l'effectif sans aucun match plus récent (un gardien revenu,
  # demande de l'auteur, 06/10/2026)
  - saison: "2023-2024"
    competition: "https://www.ffhandball.fr/competitions/saison-2023-2024-19/regional/honneur-masculin-aura-22315/"
    niveau: 2
    club_seul: true
  # 2025-2026, moins de 18 ans du club (2e phase, poule 12) : seulement pour un joueur de l'effectif
  # sans aucun match senior, qui y jouait (demande de l'auteur, 05/10/2026) ; jamais pour les adversaires
  - saison: "2025-2026"
    competition: "https://www.ffhandball.fr/competitions/saison-2025-2026-21/regional/m18-ans-masculin-division-2-aura-30005/"
    categorie: "M18"
    club_seul: true
# Lien avec l'application de préparation de séances (fichier .hbt.json à importer)
entrainement:
  equipe: "Seniors garçons"
  categorie_age: "+18 ans"
  # jours d'entraînement : 0 = lundi ... 6 = dimanche
  jours: [1, 4]
