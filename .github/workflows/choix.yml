# Choix de l'entraîneur : la page, en mode entraîneur, publie les feuilles qu'il a validées.
#
# Elle lance ce workflow avec un jeton GitHub limité à ce dépôt (droit « Actions » seulement :
# il peut lancer ce workflow, pas modifier le code). Sa seule entrée est un coffre chiffré avec
# la phrase du club ; il est vérifié (pipeline/choix.py) puis écrit dans publie/choix.enc.
# Le dépôt est public : rien n'est jamais déchiffré dans ce journal, et l'entrée, visible dans
# le résumé du lancement, n'est que le coffre chiffré.
#
# Comme pour la caisse noire : on part du dernier état de la branche (pas du commit du lancement)
# et, si le push est refusé, on récrit le fichier sur le dernier état ; l'envoi le plus récent gagne.
#
# Puis tout se recalcule avec ces choix (demande de l'auteur, 10/10/2026) : la collecte quotidienne en mode
# « recalcul », sans rien demander au site de la fédération. Si une collecte attend déjà son tour, elle partira du
# dernier état et prendra ces choix : on n'en lance pas une autre (elle prendrait sa place dans la file).
name: Choix de l'entraîneur

on:
  workflow_dispatch:
    inputs:
      choix:
        description: "Feuilles validées, chiffrées (écrit par la page de l'entraîneur)"
        required: true

permissions:
  contents: write
  actions: write   # lancer le recalcul (workflow « Collecte quotidienne »)

concurrency:
  group: choix
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # le dernier état de la branche, pas le commit du lancement

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier et écrire les choix (toujours chiffrés), enregistrer dans le dépôt
        id: ecrit
        env:
          HBPSM_CLE: ${{ secrets.HBPSM_CLE }}
          HBPSM_CHOIX: ${{ inputs.choix }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          git config user.name "hbpsm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for essai in 1 2 3 4 5; do
            git fetch -q origin "$BRANCHE" && git reset -q --hard FETCH_HEAD
            python -m pipeline.choix
            git add publie/choix.enc
            git diff --cached --quiet && exit 0
            git commit -q -m "Choix de l'entraîneur"
            if git push -q origin "HEAD:$BRANCHE"; then echo "publie=oui" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Dépôt modifié entre-temps : nouvel essai sur le dernier état ($essai/5)"
            sleep $((essai * 5))
          done
          exit 1

      - name: Tout recalculer avec ces choix (sans collecte sur le site de la fédération)
        if: steps.ecrit.outputs.publie == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          # une collecte en attente (pas encore commencée) partira du dernier état : elle prendra ces choix
          filtre='[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length'
          attente=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly.yml --limit 20 --json status -q "$filtre")
          if [ "${attente:-0}" != "0" ]; then
            echo "Une collecte attend déjà son tour : elle prendra ces choix."
          else
            gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCHE" -f recalcul=true
            echo "Recalcul lancé."
          fi
