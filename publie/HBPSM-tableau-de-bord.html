function ledger(){   // l'état de la caisse : amendes, paiements, propositions déjà tranchées, soldes
  const pub = (CAISSE && CAISSE.ops) || [], seen = new Set(pub.map(o => o.id));
  const ops = [...pub, ...outbox().filter(o => !seen.has(o.id)).map(o => Object.assign({envoi: true}, o))];
  const gone = new Set(ops.filter(o => o.t === "annule").map(o => o.cible));
  const fines = ops.filter(o => o.t === "amende" && !gone.has(o.id));
  const pays = ops.filter(o => o.t === "paiement" && !gone.has(o.id));
  const refus = ops.filter(o => o.t === "refus" && !gone.has(o.id));   // un « ne participe pas » se retire en l'annulant
  const decided = new Set([...fines.map(o => o.auto), ...refus.map(o => o.auto)].filter(Boolean));
  // hors caisse : l'effectif, ou un trésorier (« ne participe pas » sur la cotisation) ; sortis[c] = cette saisie
  const sortis = Object.fromEntries(refus.filter(o => String(o.auto).startsWith("cotisation:")).map(o => [autoWho(o.auto), o.id]));
  const out = new Set([...(D.caisse.hors || []), ...Object.keys(sortis)]);
  const cotises = new Set(fines.filter(f => f.regle === "cotisation").map(f => f.joueur));
  const bal = {};
  // la cotisation se doit et se paie, mais ce n'est pas une amende : ni podium, ni compte des amendes
  const of = c => bal[c] = bal[c] || {du: 0, paye: 0, n: 0, tournees: 0, amendes: 0, cotise: false};
  for(const c of members()) if(!out.has(c)) of(c);
  for(const f of fines){ const b = of(f.joueur);
    if(f.regle === "cotisation"){ b.cotise = true; b.du += f.montant || 0; continue; }
    b.n++; if(f.montant == null) b.tournees++; else { b.du += f.montant; b.amendes += f.montant; } }
  for(const p of pays) of(p.joueur).paye += p.montant || 0;
  return {ops, fines, pays, decided, bal, out, sortis, cotises};
}

function cnProposals(L){

    if(o.t !== "proposition" || seen.has(o.id) || L.decided.has(o.id) || !RULE(o.regle)) continue;
    seen.add(o.id);

    out.push({id: o.id, regle: o.regle, joueur: o.joueur, n: o.n || 1, montant: o.montant, date: o.date, match: o.match || null, joueurs: true,
              irrecevable: !ok, motif: (o.note ? o.note + " · " : "") + "proposée par " + memberName(o.par)
                + (ok ? "" : " (pas à jour de sa cotisation : irrecevable)") + (o.envoi ? " · envoi en cours" : "")});
  }

}
function caisseProposals(L){   // d'après les feuilles (calculées sur GitHub), les propositions des joueurs, et les « Bon point ! » des mois finis
  const props = [...openProps(L, p => !p.check && p.regle !== "cotisation"), ...cnProposals(L), ...presenceFines(L), ...motmFines(L)].filter(p => !L.out.has(p.joueur));
  const first = L.ops.map(o => (o.le || "").slice(0, 7)).filter(Boolean).sort()[0];
  const cur = new Date().toISOString().slice(0, 7);
  for(let m = first; m && m < cur; m = nextMonth(m)){
    const fined = new Set(L.fines.filter(f => (f.date || "").slice(0, 7) === m && f.regle !== "bon_point").map(f => f.joueur));
    for(const c of participants(L)){
      const id = "bon_point:" + m + ":" + c;
      if(!fined.has(c) && !L.decided.has(id)) props.push({id, regle: "bon_point", joueur: c, n: 1, montant: 1, date: m + "-28", match: null, motif: "aucune amende en " + monthName(m)});
    }
  }

}

function penaltyOps(p){   // règlement : 1 € par penalty manqué à partir du 2e échec ; hors cadre, 2 € tout de suite
  const st = PENS[p.id] || {}, ops = [], le = new Date().toISOString(), date = p.date;
  for(const [c, v] of Object.entries(st)){
    const h = Math.min(v.h, v.a), inside = v.a - h, fined = h ? inside : Math.max(0, inside - 1);
    const note = p.motif.replace(/^penalties /, "") + " : " + v.a + " manqué" + (v.a > 1 ? "s" : "") + (h ? ", dont " + h + " hors cadre" : "");
    if(h) ops.push({id: "v:" + p.id + ":" + c + ":hc", t: "amende", joueur: c, regle: "m_penalty_hors_cadre", n: h, montant: 2 * h, date, match: p.match, note, auto: p.id, par: whoAmI(), le});

  }

  return ops;
}

// l'homme du match : élu par les joueurs de la feuille (lue, sinon celle que l'entraîneur a publiée), pendant 48 h
function voteWindow(m){
  const H = PRESC().vote_heures ?? 48, day = String(m.date || "").slice(0, 10);
  if(!day || day < (PRESC().vote_depuis || "")) return null;
  let debut;
  if(String(m.date).length > 10 && !m.provisoire) debut = new Date(new Date(m.date).getTime() + MATCH_MIN * 60000);
  else if(m.bp != null) debut = new Date(day + "T22:00");   // horaire jamais fixé : dès que le score est connu
  else return null;
  return {debut, fin: new Date((m.provisoire ? new Date(addDays(day, 1) + "T22:00") : debut).getTime() + H * 3600000)};
}
const electors = m => { const sheet = (m.joueurs || []).filter(k => byCle(k));
  if(sheet.length) return sheet;
  const pub = CHOIX && CHOIX.matchs && CHOIX.matchs[m.id];
  return pub ? (pub.joueurs || []).filter(k => String(k).startsWith("R:") && byCle(k)) : []; };
function ballot(m, now = new Date()){
  const w = voteWindow(m);
  if(!w) return null;
  const el = electors(m), last = {}, count = {};
  for(const o of presOps()) if(o.t === "vote" && String(o.match) === String(m.id) && el.includes(o.joueur) && el.includes(o.pour)
    && o.pour !== o.joueur && opTime(o) <= w.fin.getTime()) last[o.joueur] = o;
  for(const o of Object.values(last)) count[o.pour] = (count[o.pour] || 0) + 1;
  const top = Math.max(0, ...Object.values(count));
  return {m, w, el, last, count, top, votants: Object.keys(last).length, ouvert: now >= w.debut && now <= w.fin, clos: now > w.fin,
          elus: top ? Object.keys(count).filter(c => count[c] === top) : []};
}
// les votes ouverts, et ceux clos depuis moins d'une semaine
const ballots = (now = new Date()) => agendaList().map(m => ballot(m, now)).filter(b => b && now >= b.w.debut && now - b.w.fin < 7 * 86400000);
function voteCard(b, me){

      ? '<p class="vote-elu">'+b.elus.map(c => '<b>'+esc(memberName(c))+'</b>').join(" et ")+' <span class="small muted">'+b.top+' voix sur '+b.votants+' votant'+(b.votants > 1 ? "s" : "")+'</span></p>'
        + '<p class="small muted">'+(b.elus.length > 1 ? 'Ex aequo : chacun' : 'Il')+' s\'acquitte de '+euros(RULE("m_mvp").montant)+' pour la caisse noire (proposé aux trésoriers).</p>'
      : '<p class="small muted">Aucun vote : pas d\'homme du match.</p>')+'</div>';
  const h = '<div class="panel vote"><p>🏆 Homme du match · '+title+' <span class="small muted">· vote ouvert jusqu\'au '+esc(dateHeure(b.w.fin))+' · '+b.votants+' vote'+(b.votants > 1 ? "s" : "")+' sur '+b.el.length+'</span></p>';
  if(!b.el.length) return h + '<p class="small muted">Le vote s\'ouvre aux joueurs de la feuille dès que l\'entraîneur l\'a publiée ou que la feuille de match est lue.</p></div>';
  if(!b.el.includes(me)) return h + '<p class="small muted">'+(me || COACH ? 'Seuls les joueurs de la feuille votent' : 'Dites qui vous êtes pour voter, si vous étiez sur la feuille')+' ; le résultat sera visible de tous à la fin du vote.</p></div>';

    + '<div class="cchips">'+b.el.filter(c => c !== me).map(c => '<button class="cchip'+(mine && mine.pour === c ? " on" : "")+'" data-vote="'+esc(b.m.id)+'|'+esc(c)+'">'+esc(memberName(c))+'</button>').join("")+'</div></div>';
}
function vote(mid, c){

// la caisse : sans réponse à temps, l'amende du règlement ; l'homme du match, la sienne ; à valider par un trésorier.
// Le motif dit seulement « pas de réponse » ou « en retard », jamais la réponse elle-même.
function presenceFines(L, now = new Date()){
  const from = PRESC().amendes_depuis;
  if(!from || !PRESJ) return [];   // tant que le journal n'est pas lu, personne n'est en défaut
  const out = [], who = participants(L).filter(c => String(c).startsWith("R:"));
  for(const e of events(from, ymd(now))){
    if(e.annule || deadline(e) >= now) continue;
    const code = e.type === "m" ? "m_sporteasy" : "e_sporteasy", r = RULE(code);
    for(const c of who){
      const p = byCle(c), x = decl()[c + "|" + e.id], id = code + ":" + e.id + ":" + c;
      if(!p || !concerned(p, e) || (x && opTime(x.first) <= deadline(e).getTime()) || L.decided.has(id)) continue;
      out.push({id, regle: code, joueur: c, n: 1, montant: r.montant, date: e.day, match: e.type === "m" ? e.m.id : null,
        motif: (x ? "réponse donnée en retard" : "pas de réponse") + " pour " + evName(e) + " (attendue avant le " + dlText(e) + ")"});
    }
  }
  return out;
}
function motmFines(L, now = new Date()){
  const out = [];
  for(const m of agendaList()){
    const b = ballot(m, now);
    if(!b || !b.clos || !b.elus.length) continue;
    for(const c of b.elus){
      const id = "m_mvp:" + m.id + ":" + c;
      if(!L.decided.has(id)) out.push({id, regle: "m_mvp", joueur: c, n: 1, montant: RULE("m_mvp").montant, date: String(m.date || "").slice(0, 10), match: m.id,
        motif: "homme du match contre " + teamShort(m.adversaire) + " : " + b.top + " voix sur " + b.votants});
    }
  }
  return out;
}

// l'entraîneur, et lui seul : qui a dit quoi, et la feuille qu'il bouge d'un geste (demande de l'auteur, 09/10/2026)
function presWhy(p, m, e){
  if(injured(p, m)) return ["no", "🩹 blessé (votre saisie)"];
  if(gone(p, m)) return ["no", untilText(p)];
  if(!dispo(p)) return ["no", "indisponible pour la saison"];
  if(declaredAbsent(p, m)) return ["no", "absent : votre saisie"];
  const s = statusOf(p.cle, e), late = s.retard ? " · en retard" : "";
  if(s.etat === "absent") return ["no", motifTxt(s) + late];
  if(s.etat === "present") return ["ok", "✓ a dit venir" + late];
  return s.etat === "sans" ? ["no", "absent – sans justification"] : ["wait", "pas encore répondu"];
}
function moveSel(id, cle, add){   // retenir ou retirer, comme un clic dans la planification
  const r = PLAN.find(x => String(x.m.id) === id), p = byCle(cle);
  if(!r || !p) return;
  const dm = S.dm[id] = S.dm[id] || {}, pin = S.pin[id] = S.pin[id] || {};
  if(r.fixed){   // feuille validée : on la retouche, les autres restent
    S.valide = S.valide || {}; S.valide[id] = null;
    const drop = add ? r.sel.filter(q => isGK(q) === isGK(p)).sort((a, b) => val(a, r.m) - val(b, r.m))[0] : null;
    for(const q of r.sel) if(q !== p && q !== drop && !pin[q.cle]) pin[q.cle] = "in";
  }
  if(add){ if(availOf(p, r.m) !== "d") dm[cle] = "d"; pin[cle] = "in"; }
  else pin[cle] = "out";
}

    + t.absent.length+' absent'+(t.absent.length > 1 ? "s" : "")+' · '+(t.attente.length + t.sans.length)+' sans réponse <span class="muted">(réponses attendues avant le '+esc(dlText(e))+')</span></p>'
    + etatLine(r)+'<div class="board-cols">'+col("Sur la feuille", sel, "out", sel.length+"/"+r.size)+col("Ont dit venir", pres, "in", pres.length)
    + col("Sans réponse", none, "in", none.length)+col("Absents", abs, null, abs.length)+'</div>'
    + '<p class="small muted">Retenir ou retirer change la feuille comme un clic dans la planification ; validez-la ensuite pour la publier.</p></div>';

function downloadJSON(obj, name){
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"}));
  const a = Object.assign(document.createElement("a"), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
// Le message part dans le presse-papiers ; la convocation est notée comme envoyée.
function copyConvocation(id){
  const r = PLAN.find(x => String(x.m.id) === id);
  if(!r) return;
  const done = () => {
    S.convoque[id] = new Date().toISOString(); save(); render(true);
    const c = document.getElementById("copie");
    if(c) c.textContent = "Message copié : collez-le dans le groupe des joueurs.";
  };
  const fallback = () => {
    const t = document.getElementById("message");
    if(!t) return;
    t.select();
    try { if(document.execCommand("copy")) done(); } catch (e) {}
  };
  if(navigator.clipboard) navigator.clipboard.writeText(convText(r)).then(done, fallback); else fallback();
}
// Le planning ne vit que dans ce navigateur : un fichier pour le garder ou le reprendre ailleurs.
const PLAN_KEYS = ["postes", "absents", "depannage", "valide", "dm", "pin", "rdv", "convoque", "regle", "annule"];
function exportPlan(){
  const out = {format:"hbpsm-planning", v:1, exporte:new Date().toISOString()};
  for(const k of PLAN_KEYS) out[k] = S[k];
  downloadJSON(out, "planning-" + new Date().toISOString().slice(0, 10) + ".json");
}
function importPlan(file){
  file.text().then(text => {
    const box = JSON.parse(text);
    if(box.format !== "hbpsm-planning") throw new Error("format");
    for(const k of PLAN_KEYS) if(box[k] !== undefined) S[k] = box[k];
    normRule(); save(); render(true);
  }).catch(() => alert("Ce fichier n'est pas un planning du tableau de bord."));
}

const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function openVault(env, phrase){
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(phrase.trim()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(env.sel), iterations:env.iterations, hash:"SHA-256"},
    material, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(env.nonce)}, key, b64(env.donnees));
  return JSON.parse(new TextDecoder().decode(plain));
}
const stored = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
async function sealVault(obj, phrase){   // le même coffre que pipeline/vault.py
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const iterations = Number(CFG.iterations) || 600000;
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(phrase.trim()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations, hash:"SHA-256"}, material, {name:"AES-GCM", length:256}, false, ["encrypt"]);
  const data = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  const enc = u => { let s = ""; for(const b of u) s += String.fromCharCode(b); return btoa(s); };
  return {format:"hbpsm-chiffre", v:1, kdf:"PBKDF2-SHA256", iterations, sel:enc(salt), chiffre:"AES-256-GCM", nonce:enc(iv), donnees:enc(data)};
}
async function fetchChoices(){   // vrai si les choix publiés ont changé
  const phrase = stored(PASS);
  if(!CFG.choix || !phrase) return false;
  let env = null;
  try {
    const r = await fetch(CFG.choix + "?t=" + Date.now(), {cache:"no-store"});
    if(r.status === 404){ const had = !!CHOIX; CHOIX = null; CHOIX_SIG = null; forgetWithdrawn(); return had; }   // rien de validé encore
    if(r.ok) env = await r.json();
  } catch (e) {}
  if(!env){ try { env = JSON.parse(stored(CHOIX_KEY) || "null"); } catch (e) {} }   // hors connexion : la dernière copie
  if(!env || env.donnees === CHOIX_SIG) return false;
  try { CHOIX = await openVault(env, phrase); CHOIX_SIG = env.donnees; } catch (e) { return false; }
  forgetWithdrawn();
  try { localStorage.setItem(CHOIX_KEY, JSON.stringify(env)); } catch (e) {}
  return true;
}
function forgetWithdrawn(){   // un retrait désormais en ligne n'a plus à être retenu ici
  if(!S.retire) return;
  for(const id of Object.keys(S.retire)) if(!(CHOIX && CHOIX.matchs && CHOIX.matchs[id])) delete S.retire[id];
  save();
}
function validate(id){   // la feuille du moment devient le choix de l'entraîneur, puis part aux joueurs
  const r = PLAN.find(x => String(x.m.id) === String(id));
  if(!r) return;
  S.valide = S.valide || {};
  S.valide[r.m.id] = {joueurs: r.sel.map(p => p.cle), le: new Date().toISOString(), journee: r.m.journee ?? null};
  if(S.retire) delete S.retire[r.m.id];
  save(); render(true);
  publishChoices();
}
function withdraw(id){   // publiée : on la retire aussi pour les joueurs ; sinon, seulement ici
  const r = PLAN.find(x => String(x.m.id) === String(id));
  if(!r || !confirm("Retirer la validation de la feuille J" + (r.m.journee ?? "?") + " ? Les joueurs reverront une suggestion.")) return;
  if(S.valide) delete S.valide[r.m.id];
  const published = !!pubOf(r.m);
  if(published){ S.retire = S.retire || {}; S.retire[r.m.id] = new Date().toISOString(); }
  save(); render(true);
  if(published) publishChoices();
}
async function publishChoices(){
  if(!COACH) return;
  const token = stored(TOKEN), phrase = stored(PASS);
  if(!token){ PUB = "jeton"; render(true); return; }
  if(!CFG.depot || !phrase){ PUB = "erreur"; render(true); return; }
  // ce qui est déjà publié (un autre ordinateur a pu valider d'autres matchs), puis les validations d'ici
  // les matchs à venir, et les derniers joués (le bilan d'un match compare la feuille au choix de l'entraîneur)
  const ids = new Set([...PLAN.map(r => String(r.m.id)), ...(D.derniers || []).filter(x => !x.saison || x.saison === D.meta.saison).map(x => String(x.id))]), matchs = {};
  for(const [id, c] of Object.entries((CHOIX && CHOIX.matchs) || {})) if(ids.has(id) && !(S.retire && S.retire[id])) matchs[id] = c;
  for(const [id, c] of Object.entries(S.valide || {})) if(c && ids.has(id)) matchs[id] = c;
  PUB = "envoi"; render(true);
  try {
    const env = await sealVault({format:"hbpsm-choix", v:1, matchs, blesses: blesses(), absents: absentsNow(), rdv: rdvNow(), annulees: annuleesNow()}, phrase);
    const r = await fetch("https://api.github.com/repos/" + CFG.depot + "/actions/workflows/choix.yml/dispatches", {
      method:"POST", body: JSON.stringify({ref: CFG.branche || "main", inputs: {choix: JSON.stringify(env)}}),
      headers:{"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/json"}});
    PUB = r.status === 204 ? "envoyee" : [401, 403, 404].includes(r.status) ? "refuse" : "erreur";
  } catch (e) { PUB = "erreur"; }
  render(true);
  if(PUB === "envoyee") watchChoices();
}
function watchChoices(){   // la mise en ligne prend une minute ou deux : un coup d'œil toutes les 15 s
  clearInterval(PUB_POLL);
  let n = 0;
  PUB_POLL = setInterval(async () => {
    n++;
    if(await fetchChoices()){ render(true); }
    if(!PLAN.some(r => PENDING.includes(r.etat)) && !statusPending()){ PUB = ""; render(true); clearInterval(PUB_POLL); }
    else if(n >= 16) clearInterval(PUB_POLL);
  }, 15000);
}

  document.getElementById("app").innerHTML = '<div class="gate"><h1>'+esc(CFG.club || "Tableau de bord")+'</h1>'
    + '<p class="muted" style="margin-top:8px">Les résultats sont chiffrés. Saisis la phrase secrète donnée par le club : elle reste sur cet ordinateur.</p>'
    + '<label class="small muted" for="phrase" style="display:block;margin-top:14px">Phrase secrète</label>'
    + '<input id="phrase" type="password" autocomplete="current-password"'+(busy?" disabled":"")+'>'
    + '<button class="btn" id="unlock"'+(busy?" disabled":"")+'>'+(busy?"Ouverture…":"Ouvrir le tableau de bord")+'</button>'
    + (message ? '<p class="err" role="alert">'+esc(message)+'</p>' : "") + '</div>';
  const input = document.getElementById("phrase");
  if(input && !busy) input.focus();
}
const hhmm = d => d.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
function sourceText(){
  const g = new Date(GENERE);
  return "Données du " + (isNaN(g) ? GENERE : g.toLocaleString("fr-FR", {dateStyle:"medium", timeStyle:"short"}))
    + (ONLINE ? ", dernière vérification à " + hhmm(CHECKED) + " (toutes les " + Math.round(VERIF / 60000 || 1) + " min)."
              : ", copie gardée sur cet ordinateur (hors connexion" + (CHECKED ? ", dépôt injoignable à " + hhmm(CHECKED) : "") + ").");
}
function status(){
  const etat = document.getElementById("club-etat"), src = document.getElementById("source");
  if(etat) etat.textContent = !GENERE ? "" : ONLINE ? "à jour · " + hhmm(CHECKED) : "hors connexion";
  if(src && GENERE) src.textContent = sourceText();
}
async function fetchVault(){
  const r = await fetch(CFG.src + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function show(box){
  D = Object.assign(box.data, {seance_hbt: box.seance_hbt});
  GENERE = box.genere;
}
// la nouvelle page met quelques minutes à être servie : un coup d'œil chaque minute, puis on recharge
// (l'onglet ouvert est gardé ; disponibilités et réglages sont déjà rangés dans le navigateur)
function waitNewPage(app){
  if(location.protocol === "file:" || !app) return;
  let n = 0;
  const timer = setInterval(async () => {
    n++;
    try {
      const html = await (await fetch(location.pathname + "?v=" + Date.now(), {cache: "no-store"})).text();
      if(html.includes(app)){
        clearInterval(timer);
        try { sessionStorage.setItem("hbpsm:onglet", S.tab); } catch (e) {}
        location.reload();
      }
    } catch (e) {}
    if(n >= 30) clearInterval(timer);   // une demi-heure : on laisse faire le prochain chargement
  }, 60000);
}
// Le manifeste (quelques octets) dit la date des dernières données publiées : on ne télécharge
// et ne déchiffre le coffre que s'il a changé, puis on redessine sans perdre onglet ni réglages.
async function check(){
  const phrase = stored(PASS);
  if(CHECKING || !GENERE || !phrase || !CFG.manifeste) return;
  CHECKING = true;
  try {
    const m = await (await fetch(CFG.manifeste + "?t=" + Date.now(), {cache:"no-store"})).json();
    CHECKED = new Date(); ONLINE = true;
    if(m.app && m.app !== CFG.app && !NEWER){ NEWER = true; render(true); waitNewPage(m.app); }  // la page elle-même a évolué
    if(await fetchChoices()) render(true);   // l'entraîneur a validé une feuille
    if(await fetchCaisse()) render(true);    // une saisie de la caisse noire
    if(await fetchCN()) render(true);        // une proposition d'amende d'un joueur
    if(await fetchPresences()) render(true); // une réponse de présence, un « Vous êtes », un vote
    if(await fetchSante()) render(true);     // une alerte de santé (site, feuilles, jetons)
    if(m.maj && m.maj !== GENERE){
      const env = await fetchVault();
      let box;
      try { box = await openVault(env, phrase); }
      catch (e) { try { localStorage.removeItem(PASS); } catch (x) {} D = null; GENERE = null;
                  gate("Les données ont été chiffrées avec une nouvelle phrase secrète : demande-la au club."); return; }
      if(box.genere !== GENERE){
        try { localStorage.setItem(VAULT, JSON.stringify(env)); } catch (e) {}
        show(box);
        render(true);
      }
    }
  } catch (e) { CHECKED = new Date(); ONLINE = false; }
  finally { CHECKING = false; status(); }
}
setInterval(check, VERIF);
document.addEventListener("visibilitychange", () => { if(!document.hidden && Date.now() - (CHECKED || 0) > 60000) check(); });
window.addEventListener("online", check);
// passage téléphone / grand écran : la planification change de disposition
// téléphone : un mode clair au choix (par défaut, la page suit le téléphone, comme avant) ; rangé sur
// ce téléphone seulement ; la version PC ne change pas
const THEME = "hbpsm:theme";
function applyTheme(){
  const narrow = window.matchMedia && matchMedia("(max-width:560px)").matches;
  const light = narrow && stored(THEME) === "clair", root = document.documentElement, btn = document.getElementById("theme-btn");
  if(light){ root.dataset.theme = "light"; root.style.colorScheme = "light"; }
  else { delete root.dataset.theme; root.style.colorScheme = ""; }
  if(btn){ btn.setAttribute("aria-pressed", String(light)); btn.textContent = light ? "🌓" : "☀️"; btn.title = light ? "Revenir au réglage du téléphone" : "Mode clair"; }
}
document.getElementById("theme-btn").addEventListener("click", () => {
  try { stored(THEME) === "clair" ? localStorage.removeItem(THEME) : localStorage.setItem(THEME, "clair"); } catch (e) {}
  applyTheme();
});
applyTheme();
if(window.matchMedia) matchMedia("(max-width:560px)").addEventListener("change", () => { applyTheme(); if(typeof D !== "undefined" && D && D.meta) render(true); });
async function start(phrase){
  if(!window.crypto || !window.crypto.subtle){ gate("Ce navigateur ne sait pas déchiffrer les données. Essaie avec Chrome, Edge ou Firefox récents."); return; }
  if(!phrase){ gate(""); return; }
  gate("", true);
  let env = null, fresh = false;
  try { env = await fetchVault(); fresh = true; } catch (e) {}
  if(!env){ try { env = JSON.parse(stored(VAULT) || "null"); } catch (e) {} }
  if(!env){ gate("Impossible de joindre les données, et aucune copie n'existe encore sur cet ordinateur. Vérifie la connexion."); return; }
  let box;
  try { box = await openVault(env, phrase); }
  catch (e) { try { localStorage.removeItem(PASS); } catch (x) {} gate("Phrase secrète incorrecte."); return; }
  try { localStorage.setItem(PASS, phrase.trim()); if(fresh) localStorage.setItem(VAULT, JSON.stringify(env)); } catch (e) {}
  show(box);
  CHECKED = new Date(); ONLINE = fresh;
  document.querySelector("nav.tabs").hidden = false;
  render(false);
  status();
  fetchChoices().then(changed => { if(changed) render(true); });
  fetchCaisse().then(changed => { if(changed) render(true); });
  fetchCN().then(changed => { if(changed) render(true); if(cnOutbox().length) sendCN(); });
  fetchPresences().then(changed => { if(changed) render(true); ensureClaim(); });   // « Vous êtes » choisi avant : partagé
  fetchSante().then(changed => { if(changed) render(true); });   // une proposition restée en route : renvoyée
  check();  // le manifeste dit aussi si la page elle-même a une version plus récente
}
document.addEventListener("click", ev => {
  if(ev.target.id === "unlock") start(document.getElementById("phrase").value);
  else if(ev.target.dataset && ev.target.dataset.lock){ try { localStorage.removeItem(PASS); localStorage.removeItem(VAULT); } catch (e) {} D = null; GENERE = null; status(); gate(""); }
});
// le fichier .ics se fabrique au clic (un lien data: est refusé par certains téléphones) ; un clic ailleurs ferme le menu
document.addEventListener("click", ev => {
  const cp = ev.target.closest && ev.target.closest("a[data-copy-ics]");
  if(cp){
    ev.preventDefault();
    const done = () => showWhy("Adresse du calendrier copiée : dans votre agenda, « ajouter un agenda à partir d'une URL », puis collez-la. Les matchs s'y mettront à jour d'eux-mêmes.");
    if(navigator.clipboard) navigator.clipboard.writeText(CFG.ics).then(done, () => showWhy("Adresse du calendrier : " + CFG.ics));
    else showWhy("Adresse du calendrier : " + CFG.ics);
    return;
  }
  const a = ev.target.closest && ev.target.closest("a[data-ics]");
  if(a){
    const m = ((D && D.saison && D.saison.matchs) || []).find(x => String(x.id) === a.dataset.ics), e = m && matchEvent(m);
    if(!e){ ev.preventDefault(); return; }
    if(a.dataset.url) URL.revokeObjectURL(a.dataset.url);
    a.href = a.dataset.url = URL.createObjectURL(new Blob([icsText(e)], {type: "text/calendar;charset=utf-8"}));
    return;
  }
  for(const d of document.querySelectorAll("details.agenda[open]")) if(!d.contains(ev.target)) d.open = false;
});
document.addEventListener("keydown", ev => { if(ev.key === "Enter" && ev.target.id === "phrase") start(ev.target.value); });
if(D){ document.querySelector("nav.tabs").hidden = false; render(false); }
else start(stored(PASS));
</script>
