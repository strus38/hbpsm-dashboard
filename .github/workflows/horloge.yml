# Horloge de la collecte (demande de l'auteur, 11/10/2026) : la collecte quotidienne part, à l'heure de Paris,
#   - le dimanche et le lundi, toutes les deux heures de 6 h à 22 h (les feuilles du week-end arrivent) ;
#   - du mardi au samedi, à 6 h, 12 h et 18 h.
#
# Les lancements programmés de GitHub partent avec des heures de retard, ou pas du tout (pipeline/horloge.py, relevés du
# 19/10 au 08/11/2026). Depuis le 08/11/2026 (demande de l'auteur : « rends l'horloge moins fragile »), l'horloge passe
# toutes les heures, et chaque passage rattrape l'horaire manqué : il lance la collecte quand aucune collecte réussie
# (`collecte` du manifeste : les deux poules lues) n'a eu lieu depuis le dernier horaire passé. Un passage sauté par
# GitHub est donc repris au suivant, et un site de la fédération en panne (502, 504) fait réessayer d'heure en heure. Rien
# quand une collecte est en cours ou attend son tour, ni quand l'horaire suivant arrive dans moins d'une demi-heure.
# Les passages sans objet restent ici, hors de la file d'attente de la collecte (groupe « collecte »), où ils prendraient
# la place d'une collecte ou d'un recalcul en attente : ce workflow ne fait que lancer « Collecte quotidienne ».
# 4 h à 22 h UTC : 5 h à 23 h à Paris l'hiver, 6 h à minuit l'été ; chaque horaire a son passage, et ceux qui suivent.
# Minute 7 plutôt que 0 : GitHub retarde le plus les lancements programmés du début de l'heure.
# Les deux tâches de cron-job.org (README, « Déclenchement ») partent, elles, à l'heure : leurs collectes comptent ici
# comme les autres, et l'horloge ne fait plus alors que reprendre un horaire manqué.
name: Horloge de la collecte

on:
  schedule:
    - cron: "7 4-22 * * *"
  workflow_dispatch:   # à la main : dit si une collecte est due, et la lance si c'est le cas

permissions:
  actions: write    # voir les collectes en cours, lancer la collecte
  contents: read    # le manifeste (dernière collecte réussie) et pipeline/horloge.py

jobs:
  lancer:
    # depuis main seulement : lancée sur une autre branche, la collecte y écrirait ses données
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # d'abord les collectes en cours, puis le manifeste : dans l'autre ordre, une collecte finie entre les deux
      # passerait pour manquée et en ferait lancer une autre ; GitHub muet : on tente quand même
      - name: Collectes en cours ou en attente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly.yml --limit 20 --json status,displayTitle \
            > "$RUNNER_TEMP/collectes.json" || echo "[]" > "$RUNNER_TEMP/collectes.json"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # le dernier état de la branche, pas celui du lancement
          sparse-checkout: |
            pipeline/horloge.py
            publie/manifeste.json
          sparse-checkout-cone-mode: false

      - name: Une collecte est-elle due ?
        id: due
        run: python3 pipeline/horloge.py publie/manifeste.json "$RUNNER_TEMP/collectes.json"

      - name: Lancer la collecte
        if: steps.due.outputs.lancer == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHE: ${{ github.ref_name }}
        run: gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCHE" && echo "Collecte lancée."
