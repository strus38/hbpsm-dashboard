# Ce qu'un joueur de l'HBPSM envoie depuis la page : proposition d'amende de la caisse noire, réponse de
# présence à un entraînement ou à un match, « Vous êtes », vote de l'homme du match.
#
# La page lance ce workflow avec un jeton limité à ce dépôt (droit « Actions » seulement) : il ne
# peut rien faire d'autre. Sa seule entrée est un coffre chiffré avec la phrase du club ; il est
# vérifié et ajouté aux journaux propositions.enc (amendes proposées) et presences.enc (réponses,
# « Vous êtes », votes) par propositions.py. Le dépôt est public : rien n'est jamais déchiffré dans
# ces journaux, et l'entrée, visible dans le résumé du lancement, n'est que le coffre chiffré. Les
# trésoriers valident ou refusent les amendes dans le tableau de bord.
#
# Deux envois rapprochés : le second, mis en attente, repartait du commit de son lancement (journal
# sans le premier) et butait sur un conflit au push. On part donc du dernier état de la branche et,
# si le push est refusé, on y réapplique l'envoi (sans doublon).
name: Envoi d'un joueur

on:
  workflow_dispatch:
    inputs:
      prop:
        description: "Proposition chiffrée (écrite par la page)"
        required: true

permissions:
  contents: write

concurrency:
  group: propositions
  cancel-in-progress: false

jobs:
  ajouter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # le dernier état de la branche, pas le commit du lancement

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier et ajouter l'envoi (toujours chiffré), enregistrer dans le dépôt
        env:
          HBPSM_CLE: ${{ secrets.HBPSM_CLE }}
          HBPSM_PROP: ${{ inputs.prop }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          git config user.name "hbpsm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for essai in 1 2 3 4 5; do
            git fetch -q origin "$BRANCHE" && git reset -q --hard FETCH_HEAD
            python propositions.py
            git add -- *.enc
            git diff --cached --quiet && exit 0
            git commit -q -m "Envoi d'un joueur"
            git push -q origin "HEAD:$BRANCHE" && exit 0
            echo "Journal modifié entre-temps : nouvel essai sur le dernier état ($essai/5)"
            sleep $((essai * 5))
          done
          exit 1
